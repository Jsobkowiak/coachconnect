[project]
name = "coachconnect-exercises"
version = "0.1.0"
description = "Exercise catalogue and self-hosted Prefect ingestion pipeline"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "pillow>=12,<13",
  "prefect==3.8.8",
  "pydantic==2.14.0",
  "pydantic-settings==2.15.0",
  "pymongo==4.18.3",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[project.scripts]
exercise-etl = "exercise_catalog.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exercise_catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the local MongoDB service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
