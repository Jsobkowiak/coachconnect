name: coachconnect
x-catalog-environment: &catalog-environment
  CATALOG_MONGO_URI: mongodb://catalog:${CATALOG_MONGO_PASSWORD:-not-configured}@catalog-mongo:27017/coachconnect_exercises?authSource=coachconnect_exercises
  CATALOG_DATABASE: coachconnect_exercises
  CATALOG_RAW_DIRECTORY: /data/raw
  CATALOG_MEDIA_DIRECTORY: /data/media
  PREFECT_API_URL: http://prefect:4200/api
  PREFECT_UI_URL: http://localhost:4200
  PREFECT_SERVER_ANALYTICS_ENABLED: "false"
services:
  catalog-mongo:
    image: mongo:8.0
    profiles: [catalog]
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${CATALOG_MONGO_ROOT_PASSWORD:-not-configured}
      MONGO_INITDB_DATABASE: coachconnect_exercises
      CATALOG_MONGO_PASSWORD: ${CATALOG_MONGO_PASSWORD:-not-configured}
    ports:
      - "127.0.0.1:57017:27017"
    volumes:
      - catalog-mongo-data:/data/db
      - ./apps/exercise-catalog/mongo/init.js:/docker-entrypoint-initdb.d/catalog.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  prefect:
    image: coachconnect-exercises:local
    build: ./apps/exercise-catalog
    profiles: [catalog]
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_HOME: /var/lib/prefect
      PREFECT_SERVER_UI_API_URL: http://localhost:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - prefect-data:/var/lib/prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
  catalog-api:
    image: coachconnect-exercises:local
    build: ./apps/exercise-catalog
    profiles: [catalog]
    environment: *catalog-environment
    volumes:
      - ./.local/catalog/media:/data/media:ro
    depends_on:
      catalog-mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20
  catalog-etl:
    image: coachconnect-exercises:local
    build: ./apps/exercise-catalog
    profiles: [etl]
    environment: *catalog-environment
    depends_on:
      catalog-mongo:
        condition: service_healthy
      prefect:
        condition: service_healthy
    volumes:
      - ./.local/catalog/raw:/data/raw
      - ./.local/catalog/media:/data/media
    command: ["exercise-etl", "import"]
  training-db:
    image: postgres:17
    profiles: [training]
    environment:
      POSTGRES_DB: coachconnect_training
      POSTGRES_USER: training
      POSTGRES_PASSWORD: ${TRAINING_DB_PASSWORD:-not-configured}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - training-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training -d coachconnect_training"]
      interval: 3s
      timeout: 3s
      retries: 30
  training-app:
    image: coachconnect-training:local
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    profiles: [training]
    environment:
      TRAINING_DB_HOST: training-db
      TRAINING_DB_PORT: 5432
      TRAINING_DB_PASSWORD: ${TRAINING_DB_PASSWORD:-not-configured}
      CATALOG_API_URL: http://catalog-api:8000
      TRAINING_KEY_DIRECTORY: /app/security
      TRAINING_BOOTSTRAP_TOKEN_HASH: ${TRAINING_BOOTSTRAP_TOKEN_HASH:-}
    depends_on:
      training-db:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
    volumes:
      - training-auth-keys:/app/security
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "dotnet", "CoachConnect.Training.dll", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
  metabase-db:
    image: postgres:17
    profiles: [analytics]
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:-not-configured}
    volumes:
      - metabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 30
  metabase:
    image: metabase/metabase:v0.64.1
    profiles: [analytics]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-not-configured}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_KEY:-not-configured}
      MB_SITE_URL: http://localhost:3000
      MB_REPORT_TIMEZONE: Europe/Paris
      MB_ANON_TRACKING_ENABLED: "false"
      MB_ENABLE_PUBLIC_SHARING: "false"
    depends_on:
      metabase-db:
        condition: service_healthy
      catalog-mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s
volumes:
  training-auth-keys:
  catalog-mongo-data:
  prefect-data:
  metabase-db-data:
  training-db-data:
