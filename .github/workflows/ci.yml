name: CI
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: dotnet build CoachConnect.sln --configuration Release
      - run: npm --prefix apps/frontend ci --no-audit --no-fund
      - run: npm --prefix apps/frontend run build
      - name: Validate Compose without local secrets
        run: docker compose --env-file /dev/null --profile training --profile catalog --profile etl --profile analytics config --quiet
      - name: Validate production overlay
        run: docker compose --env-file /dev/null -f compose.yaml -f infrastructure/docker/compose.prod.yaml --profile training --profile catalog --profile analytics config --quiet
        env:
          TRAEFIK_NETWORK: proxy
          TRAEFIK_CERTRESOLVER: letsencrypt
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.0
      - run: uv sync --locked
        working-directory: apps/exercise-catalog
      - run: uv run pytest -m 'not integration'
        working-directory: apps/exercise-catalog
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/backend/Dockerfile -t coachconnect-training:ci .
      - run: docker build -t coachconnect-exercises:ci apps/exercise-catalog
